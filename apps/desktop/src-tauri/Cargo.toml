[package]
name = "personal-command-center"
version = "0.5.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
ical = { version = "0.11", default-features = false, features = ["ical"] }
chrono-tz = "0.10"
notify = "8.2"
tauri-plugin-updater = "~2.14"
reqwest_updater = { package = "reqwest", version = "0.13", default-features = false }
minisign-verify = "0.3"
quick-xml = "0.42"
dom_query = "0.29"
tauri = { version = "2", features = [] }
command-center-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
zeroize = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "process", "time", "io-util", "macros", "sync", "net"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
tempfile = "3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-opener = "2"
url = "2"

sha2 = "0.10"

snow = "0.10"
mdns-sd = "0.21"
