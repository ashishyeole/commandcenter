[package]
name = "command-center-mobile-peer"
version = "0.5.0"
edition = "2021"
[lib]
name = "pcc_mobile_peer"
crate-type = ["rlib", "staticlib", "cdylib"]
[dependencies]
command-center-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt", "sync"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
chrono = "0.4"
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
